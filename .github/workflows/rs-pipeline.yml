name: Jalna Pipeline

on:
  workflow_dispatch:
    inputs:
      fecha_inicio:
        required: true
        description: "Inference window start date (YYYY-MM-DD)"
        default: "2026-04-20"
      fecha_fin:
        required: true
        description: "Inference window end date (YYYY-MM-DD)"
        default: "2026-05-06"
      instance_type:
        required: false
        default: "ml.m6i.8xlarge"
        description: "SageMaker instance type"
      max_retries:
        required: false
        default: "3"
        description: "In-container papermill retries (MAX_RETRIES in entrypoint.sh)"
      retry_delay:
        required: false
        default: "120"
        description: "Seconds between in-container retries (RETRY_DELAY in entrypoint.sh)"
  # Optional: scheduled run every 5 days at 03:00 UTC (matches S2 revisit)
  schedule:
    - cron: "0 3 */5 * *"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: jalna-pipeline
  SAGEMAKER_ROLE: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/SageMakerExecutionRole

jobs:
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Building image: ${IMAGE_URI}"
          docker build -t "${IMAGE_URI}" .

          docker tag "${IMAGE_URI}" "${REGISTRY}/${ECR_REPOSITORY}:latest"

          docker push "${IMAGE_URI}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "Built and pushed: ${IMAGE_URI}"

  run:
    name: Run Jalna on SageMaker
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Python dependencies
        run: pip install boto3

      - name: Set image URI
        id: image
        run: |
          echo "uri=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/jalna-pipeline:latest" >> "$GITHUB_OUTPUT"

      - name: Submit and wait for Jalna processing job
        env:
          IMAGE_URI:          ${{ steps.image.outputs.uri }}
          FECHA_INICIO:       ${{ inputs.fecha_inicio }}
          FECHA_FIN:          ${{ inputs.fecha_fin }}
          INSTANCE_TYPE:      ${{ inputs.instance_type || 'ml.m6i.8xlarge' }}
          MAX_RETRIES:        ${{ inputs.max_retries || '3' }}
          RETRY_DELAY:        ${{ inputs.retry_delay || '120' }}
          SAGEMAKER_ROLE:     arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/AmazonSagemaker-ExecutionRole-StomaSense
          AWS_REGION:         ${{ env.AWS_REGION }}
          S3_BUCKET:          carrier-pdfs
          S3_PREFIX:          JALNA
          TEAMS_WEBHOOK_URL:  ${{ secrets.TEAMS_WEBHOOK_URL }}
          COPERNICUS_USERNAME:   ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUS_PASSWORD:   ${{ secrets.COPERNICUS_PASSWORD }}
          COPERNICUS_CLIENT_ID:  ${{ secrets.COPERNICUS_CLIENT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          REDIS_FLUSH_URL: ${{ secrets.REDIS_FLUSH_URL }}
          REDIS_AUTH_TOKEN: ${{ secrets.REDIS_AUTH_TOKEN }}
        run: python .github/scripts/run_mills.py