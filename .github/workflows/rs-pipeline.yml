name: Jalna Pipeline

on:
  workflow_dispatch:
    inputs:
      fecha_inicio:
        description: "Search window start (YYYY-MM-DD). Leave blank to auto-compute (today - 3)."
        required: false
        default: ""
      fecha_fin:
        description: "Search window end (YYYY-MM-DD). Leave blank to auto-compute (today)."
        required: false
        default: ""
      fechas:
        description: "Target processing date (YYYY-MM-DD). Leave blank to auto-compute (today - 1)."
        required: false
        default: ""
      instance_type:
        required: false
        default: "ml.m6i.8xlarge"
        description: "SageMaker instance type"
      max_retries:
        required: false
        default: "3"
        description: "In-container papermill retries"
      retry_delay:
        required: false
        default: "120"
        description: "Seconds between in-container retries"

  # Daily at 03:00 UTC — processes yesterday's S2 acquisition (T-1 target)
  # schedule:
  #   - cron: "0 3 * * *"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: jalna-pipeline
  SAGEMAKER_ROLE: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/SageMakerExecutionRole

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Step 0: Resolve dates once (manual override OR auto-compute)
  #
  # Rule: "to run for target T, we run on T+1"
  #   fecha_fin    = today                (run day)
  #   fechas       = today - 1            (target date)
  #   fecha_inicio = today - 3            (search window start; 3-day window)
  #
  # For scheduled runs the inputs are always empty → always auto-computed.
  # For manual runs, user can override any field by typing a date.
  # ───────────────────────────────────────────────────────────────────────────
  dates:
    name: Resolve dates
    runs-on: ubuntu-latest
    outputs:
      fecha_inicio: ${{ steps.compute.outputs.fecha_inicio }}
      fecha_fin:    ${{ steps.compute.outputs.fecha_fin }}
      fechas:       ${{ steps.compute.outputs.fechas }}
    steps:
      - name: Compute dates (with TZ=UTC)
        id: compute
        env:
          IN_INICIO: ${{ github.event.inputs.fecha_inicio }}
          IN_FIN:    ${{ github.event.inputs.fecha_fin }}
          IN_FECHAS: ${{ github.event.inputs.fechas }}
        run: |
          set -euo pipefail

          # Defaults derived from UTC "today" (matches your cron at 03:00 UTC).
          TODAY=$(date -u +%Y-%m-%d)
          AUTO_FIN="${TODAY}"
          AUTO_FECHAS=$(date -u -d "${TODAY} - 1 day" +%Y-%m-%d)
          AUTO_INICIO=$(date -u -d "${TODAY} - 3 days" +%Y-%m-%d)

          FECHA_INICIO="${IN_INICIO:-$AUTO_INICIO}"
          FECHA_FIN="${IN_FIN:-$AUTO_FIN}"
          FECHAS="${IN_FECHAS:-$AUTO_FECHAS}"

          # Sanity check: target must lie inside [inicio, fin]
          if [[ "$FECHAS" < "$FECHA_INICIO" || "$FECHAS" > "$FECHA_FIN" ]]; then
            echo "❌ fechas ($FECHAS) is outside [$FECHA_INICIO, $FECHA_FIN]"
            exit 1
          fi

          echo "Resolved dates:"
          echo "  fecha_inicio = $FECHA_INICIO"
          echo "  fecha_fin    = $FECHA_FIN"
          echo "  fechas       = $FECHAS"

          {
            echo "fecha_inicio=$FECHA_INICIO"
            echo "fecha_fin=$FECHA_FIN"
            echo "fechas=$FECHAS"
          } >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: dates
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "Building: ${IMAGE_URI}"
          docker build -t "${IMAGE_URI}" .
          docker tag "${IMAGE_URI}" "${REGISTRY}/${ECR_REPOSITORY}:latest"
          docker push "${IMAGE_URI}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:latest"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  run:
    name: Run Jalna on SageMaker
    needs: [dates, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Python dependencies
        run: pip install boto3

      - name: Submit and wait for Jalna processing job
        env:
          IMAGE_URI:          ${{ needs.build.outputs.image_uri }}
          FECHA_INICIO:       ${{ needs.dates.outputs.fecha_inicio }}
          FECHA_FIN:          ${{ needs.dates.outputs.fecha_fin }}
          FECHAS:             ${{ needs.dates.outputs.fechas }}
          INSTANCE_TYPE:      ${{ github.event.inputs.instance_type || 'ml.m6i.8xlarge' }}
          MAX_RETRIES:        ${{ github.event.inputs.max_retries  || '3' }}
          RETRY_DELAY:        ${{ github.event.inputs.retry_delay  || '120' }}
          SAGEMAKER_ROLE:     arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/AmazonSagemaker-ExecutionRole-StomaSense
          AWS_REGION:         ${{ env.AWS_REGION }}
          S3_BUCKET:          carrier-pdfs
          S3_PREFIX:          JALNA
          TEAMS_WEBHOOK_URL:  ${{ secrets.TEAMS_WEBHOOK_URL }}
          COPERNICUS_USERNAME:   ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUS_PASSWORD:   ${{ secrets.COPERNICUS_PASSWORD }}
          COPERNICUS_CLIENT_ID:  ${{ secrets.COPERNICUS_CLIENT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: python .github/scripts/run_mills.py